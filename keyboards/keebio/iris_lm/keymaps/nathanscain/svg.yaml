layout: { qmk_keyboard: keebio/iris_lm/k1, layout_name: LAYOUT }
layers:
  QUERTY:
    # top row
    - { tap: "`", shifted: "~" }
    - { tap: "1", shifted: "!" }
    - { tap: "2", shifted: "@" }
    - { tap: "3", shifted: "#" }
    - { tap: "4", shifted: "$" }
    - { tap: "5", shifted: "%" }
    - { tap: "6", shifted: "^" }
    - { tap: "7", shifted: "&" }
    - { tap: "8", shifted: "*" }
    - { tap: "9", shifted: "(" }
    - { tap: "0", shifted: ")" }
    - Back Space
    # upper row
    - { tap: "-", shifted: "_" }
    - Q
    - W
    - E
    - R
    - T
    - Y
    - U
    - I
    - O
    - P
    - { tap: "\\", shifted: "|" }
    # home row
    - Tab
    - { tap: A, hold: GUI }
    - { tap: S, hold: Alt }
    - { tap: D, hold: Shift }
    - { tap: F, hold: Ctrl }
    - G
    - H
    - { tap: J, hold: Ctrl }
    - { tap: K, hold: Shift }
    - { tap: L, hold: Alt }
    - { tap: ;, hold: GUI }
    - { tap: "'", shifted: '"' }
    # bottom row left
    - { tap: "Esc", shifted: "~" }
    - Z
    - X
    - C
    - V
    - B
    # upper thumbs
    - Ctrl
    - Caps Words
    # bottom row right
    - N
    - M
    - { tap: ",", shifted: "<" }
    - { tap: ".", shifted: ">" }
    - { tap: "/", shifted: "?" }
    - Shift
    # lower thumbs
    - GUI
    - { tap: MOVE Layer, type: layer-activator }
    - Enter
    - Space
    - { tap: PROG Layer, type: layer-activator }
    - Delete
  MOVE:
    # top row
    - KB Color ⮜
    - KB Color ⮞
    - KB Bright ⮟
    - KB Bright ⮝
    - Clear EEPROM
    - Boot
    - F6
    - F7
    - F8
    - F9
    - F10
    - F11
    # upper row
    - KB Toggle Color
    - Scroll ⮜
    - Scroll ⮟
    - Scroll ⮝
    - Scroll ⮞
    - Volume ⮝
    - Mouse ⮜
    - Mouse ⮟
    - Mouse ⮝
    - Mouse ⮞
    - Mouse 1
    - Mouse 2
    # home row
    - Mission Control
    - GUI
    - Alt
    - Shift
    - Ctrl
    - Volume ⮟
    - ⮜
    - ⮟
    - ⮝
    - ⮞
    - Mouse 3
    - Mouse 4
    # bottom row left
    - Display Bright ⮟
    - Display Bright ⮝
    - ⮜⮜
    - Play Pause
    - ⮞⮞
    - Mute
    # upper thumbs
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    # bottom row right
    - Home
    - Page ⮟
    - Page ⮝
    - End
    - Browse ⮜
    - Browse ⮞
    # lower thumbs
    - { tap: ▽, type: trans }
    - { tap: ▽, type: held }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
  PROG:
    # top row
    - F12
    - F1
    - F2
    - F3
    - F4
    - F5
    - Boot
    - Clear EEPROM
    - ""
    - ""
    - ""
    - ""
    # upper row
    - Insert
    - <
    - ">"
    - "{"
    - "}"
    - "_"
    - ""
    - "!"
    - "@"
    - "#"
    - $
    - "%"
    # home row
    - Delete
    - "["
    - "]"
    - (
    - )
    - ":"
    - "="
    - Ctrl
    - Shift
    - Alt
    - GUI
    - \
    # bottom row left
    - ""
    - "%"
    - /
    - "*"
    - +
    - "-"
    # upper thumbs
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    # bottom row right
    - ""
    - ^
    - "&"
    - "|"
    - "?"
    - ""
    # lower thumbs
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: trans }
    - { tap: ▽, type: held }
    - { tap: ▽, type: trans }
